<!DOCTYPE html>
<html lang="zh">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ComfyUI Web Lite</title>
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body class="m-0 p-0 font-sans bg-gray-100">
    <div class="flex flex-col md:flex-row h-screen">
      <!-- 左侧面板 -->
      <div
        class="w-full md:w-1/4 md:min-w-[300px] bg-white shadow-md flex flex-col max-h-[45vh] md:max-h-none"
      >
        <div class="p-4 border-b space-y-3">
          <h2 class="text-lg font-semibold text-gray-800">Settings</h2>

          <div>
            <label
              for="server-address"
              class="block text-sm font-medium text-gray-700 mb-1"
            >
              ComfyUI 地址
            </label>
            <div class="flex gap-2">
              <input
                type="text"
                id="server-address"
                placeholder="127.0.0.1:8188"
                class="flex-1 p-2 border rounded text-sm"
              />
              <button
                type="button"
                id="save-server"
                class="px-3 py-2 bg-gray-200 text-gray-800 rounded text-sm hover:bg-gray-300 shrink-0"
              >
                保存
              </button>
            </div>
            <p class="text-xs text-gray-500 mt-1">
              需启动 <code class="bg-gray-100 px-1 rounded">--enable-cors-header</code>
            </p>
          </div>

          <div>
            <label
              for="upload-flow-json"
              class="block text-sm font-medium text-gray-700 mb-1"
            >
              Upload workflow_api.json
            </label>
            <input
              type="file"
              id="upload-flow-json"
              accept=".json,application/json"
              class="w-full p-2 border rounded text-sm"
            />
          </div>
        </div>

        <div
          id="form-container"
          class="flex-grow p-4 space-y-4 overflow-y-auto"
        ></div>

        <div class="p-4 border-t space-y-2">
          <p
            id="progress-text"
            class="text-xs text-blue-600 hidden"
            aria-live="polite"
          ></p>
          <button
            type="button"
            id="submit-button"
            class="w-full px-4 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700 transition duration-300 text-sm disabled:opacity-50 disabled:cursor-not-allowed"
          >
            Queue
          </button>
        </div>
      </div>

      <!-- 右侧内容区 -->
      <div class="flex-1 p-6 bg-gray-50 overflow-y-auto min-h-0">
        <h2 class="text-lg font-semibold mb-4 text-gray-800">
          Generated Result
        </h2>
        <div
          id="image-container"
          class="flex flex-row flex-wrap gap-4 h-auto w-full empty-content"
        ></div>
      </div>
    </div>

    <style>
      .empty-content:empty::before {
        content: "Empty";
        display: flex;
        justify-content: center;
        align-items: center;
        width: 100%;
        min-height: 8rem;
        padding: 1rem;
        font-size: 1rem;
        color: #9ca3af;
        border: 2px dashed #d1d5db;
        border-radius: 0.5rem;
      }
    </style>

    <div
      id="fullscreen-container"
      class="fixed inset-0 bg-black bg-opacity-75 hidden flex items-center justify-center z-50"
    >
      <div class="relative">
        <img
          id="fullscreen-image"
          src=""
          alt="Fullscreen Image"
          class="max-w-full max-h-full"
        />
        <button
          type="button"
          id="close-fullscreen"
          class="absolute top-4 right-4 text-white text-2xl hover:text-gray-300"
          aria-label="关闭"
        >
          &times;
        </button>
      </div>
    </div>

    <div id="toast" class="hidden" role="status"></div>

    <script src="./script.js" defer></script>
  </body>
</html>
